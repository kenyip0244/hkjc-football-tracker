<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>⚽ HKJC 足球賽果半場篩選追蹤器</title>

  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9A%BD%3C/text%3E%3C/svg%3E">
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9A%BD%3C/text%3E%3C/svg%3E">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="⚽ HKJC 賽果">
  <meta name="theme-color" content="#0b1120">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #0b1120;
      --bg-secondary: #162032;
      --bg-card: #1a263c;
      --border-color: #2a3a54;
      --accent-green: #10b981;
      --accent-blue: #38bdf8;
      --accent-amber: #f59e0b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', 'Noto Sans TC', sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-main);
      min-height: 100vh;
      padding: 8px;
      line-height: 1.35;
      -webkit-tap-highlight-color: transparent;
    }

    .container {
      max-width: 860px;
      margin: 0 auto;
    }

    .app-header {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
      gap: 6px;
      flex-wrap: wrap;
    }

    .app-header h1 {
      font-size: 1.02rem;
      font-weight: 800;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .header-actions { display: flex; gap: 5px; align-items: center; }

    .btn-sm {
      background-color: var(--bg-secondary);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.76rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
      transition: all 0.15s;
    }
    .btn-sm:hover { background-color: #243247; border-color: #475569; }
    .btn-green { background-color: #059669; border-color: #10b981; color: #fff; }
    .btn-blue { background-color: #0284c7; border-color: #38bdf8; color: #fff; }

    .api-banner {
      background: linear-gradient(135deg, rgba(2, 132, 199, 0.15) 0%, rgba(15, 23, 42, 0.8) 100%);
      border: 1px solid var(--accent-blue);
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .api-banner-title {
      font-size: 0.85rem;
      font-weight: 800;
      color: var(--accent-blue);
    }

    .api-input-group {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .filter-box {
      background-color: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 8px 10px;
      margin-bottom: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .chip-scroll-row {
      display: flex;
      gap: 5px;
      overflow-x: auto;
      scrollbar-width: none;
      align-items: center;
    }
    .chip-scroll-row::-webkit-scrollbar { display: none; }

    .row-tag {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--text-muted);
      flex-shrink: 0;
      min-width: 36px;
    }

    .chip {
      flex-shrink: 0;
      background-color: #0b1120;
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 3px 9px;
      border-radius: 14px;
      font-size: 0.76rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }
    .chip:hover { color: #fff; border-color: #475569; }
    .chip.active {
      background-color: var(--accent-green) !important;
      color: #042f2e !important;
      border-color: var(--accent-green) !important;
      font-weight: 800 !important;
    }
    .chip.chip-blue.active {
      background-color: var(--accent-blue) !important;
      color: #082f49 !important;
      border-color: var(--accent-blue) !important;
    }

    .search-subrow {
      display: flex;
      gap: 6px;
      align-items: center;
      margin-top: 2px;
      flex-wrap: wrap;
    }

    .input-sm {
      background-color: #0b1120;
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 5px 8px;
      border-radius: 6px;
      font-size: 0.78rem;
      outline: none;
    }
    .input-sm:focus { border-color: var(--accent-blue); }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 6px;
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 6px;
      flex-wrap: wrap;
      gap: 4px;
    }
    .status-bar strong { color: var(--accent-green); font-size: 0.85rem; }

    .loading-box {
      text-align: center;
      padding: 24px 10px;
      background-color: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      margin-bottom: 6px;
    }
    .spinner {
      width: 24px;
      height: 24px;
      border: 3px solid rgba(56, 189, 248, 0.2);
      border-top-color: var(--accent-blue);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .matches-compact-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .compact-row {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 7px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: background-color 0.12s;
    }
    .compact-row:hover { background-color: #243247; border-color: #3b82f6; }
    .compact-row.matched {
      border-left: 3.5px solid var(--accent-green);
      background: linear-gradient(90deg, rgba(16, 185, 129, 0.1) 0%, rgba(26, 38, 60, 1) 100%);
    }

    .col-meta-teams {
      display: flex;
      flex-direction: column;
      gap: 2px;
      flex: 1;
      min-width: 0;
      padding-right: 8px;
    }

    .line-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.7rem;
      color: var(--text-muted);
    }
    .meta-code { font-weight: 700; color: #cbd5e1; }
    .meta-league { color: var(--accent-blue); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .line-teams {
      font-size: 0.92rem;
      font-weight: 800;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .team-name { max-width: 120px; overflow: hidden; text-overflow: ellipsis; }
    .vs-tag { font-size: 0.72rem; color: var(--text-muted); font-weight: 500; }

    .col-scores {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
      text-align: right;
    }

    .score-ft {
      font-size: 1.15rem;
      font-weight: 900;
      color: #fff;
      letter-spacing: 0.5px;
      min-width: 42px;
      text-align: center;
    }

    .badge-ht {
      font-size: 0.76rem;
      font-weight: 700;
      color: var(--text-muted);
      background: #0b1120;
      border: 1px solid var(--border-color);
      padding: 1px 5px;
      border-radius: 4px;
      min-width: 48px;
      text-align: center;
    }
    .badge-ht.hit {
      color: var(--accent-green);
      border-color: rgba(16, 185, 129, 0.5);
      background: rgba(16, 185, 129, 0.15);
    }

    .arrow-icon {
      font-size: 0.8rem;
      color: #64748b;
      margin-left: 2px;
    }

    .modal-mask {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      backdrop-filter: blur(4px);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 14px;
    }
    .modal-mask.show { display: flex; }

    .modal-card {
      background: #1e293b;
      border: 1px solid var(--border-color);
      border-radius: 14px;
      max-width: 520px;
      width: 100%;
      max-height: 88vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 10px 40px rgba(0,0,0,0.6);
    }

    .modal-header {
      background: #0f172a;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-body {
      padding: 14px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .setting-group {
      background: #0f172a;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn-full {
      width: 100%;
      padding: 9px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.84rem;
      text-align: center;
      cursor: pointer;
      border: 1px solid var(--border-color);
      background: var(--bg-secondary);
      color: #fff;
    }

    footer {
      margin-top: 20px;
      padding-top: 10px;
      border-top: 1px solid var(--border-color);
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

<div class="container">
  <header class="app-header">
    <h1>⚽ HKJC 足球賽果半場篩選追蹤器</h1>
    <div class="header-actions">
      <button class="btn-sm btn-blue" onclick="fetchMatchesForRange(true)">🌐 即時網上抓取</button>
      <button class="btn-sm" onclick="openSettingsModal()">⚙️ API 設定</button>
      <button class="btn-sm" onclick="exportCSV()">📥 匯出</button>
    </div>
  </header>

  <div id="apiKeyBanner" class="api-banner" style="display: none;">
    <div class="api-banner-title">🔑 即時連網：請填寫 API Key</div>
    <div class="api-input-group">
      <input type="password" id="bannerKeyInput" class="input-sm" style="flex: 1; min-width: 200px;" placeholder="貼上 API-Sports 或 RapidAPI Key...">
      <button class="btn-sm btn-blue" onclick="saveBannerKey()">💾 儲存並抓取</button>
      <button class="btn-sm" onclick="openTutorialModal()">📖 免費取得教學</button>
    </div>
  </div>

  <div class="filter-box">
    <div class="chip-scroll-row" id="dateChips">
      <span class="row-tag">範圍</span>
      <button class="chip chip-blue active" data-range="today">今天</button>
      <button class="chip chip-blue" data-range="yesterday">昨天</button>
      <button class="chip chip-blue" data-range="7d">7日</button>
      <button class="chip chip-blue" data-range="30d">30日</button>
      <button class="chip chip-blue" data-range="56d">56日</button>
    </div>

    <div class="chip-scroll-row" id="htChips">
      <span class="row-tag">半場</span>
      <button class="chip active" data-ht="all">全部</button>
      <button class="chip" data-ht="combo">🔥 1:0/2:0/0:1/0:2</button>
      <button class="chip" data-ht="1:0">1:0</button>
      <button class="chip" data-ht="2:0">2:0</button>
      <button class="chip" data-ht="0:1">0:1</button>
      <button class="chip" data-ht="0:2">0:2</button>
      <button class="chip" data-ht="0:0">0:0</button>
    </div>

    <div class="search-subrow">
      <input type="text" id="searchInput" class="input-sm" style="flex: 1;" placeholder="🔍 搜尋隊伍、聯賽或編號..." oninput="render()">
      <select id="leagueSelect" class="input-sm" style="max-width: 140px;" onchange="render()">
        <option value="all">所有聯賽</option>
      </select>
      <input type="date" id="singleDateInput" class="input-sm" style="max-width: 125px;" onchange="onSingleDateChange()" title="指定日期">
    </div>
  </div>

  <div class="status-bar">
    <div>顯示：<strong id="displayCount">0</strong> 場 | 符合半場條件：<strong id="matchCount">0</strong> 場</div>
    <div id="statusText" style="color: var(--accent-blue); font-size: 0.72rem;">即時網上搜尋模式</div>
  </div>

  <div id="loadingBox" class="loading-box" style="display: none;">
    <div class="spinner"></div>
    <div style="font-size: 0.8rem; color: #cbd5e1;" id="loadingMsg">正在向網上發出搜尋請求...</div>
  </div>

  <div id="matchesList" class="matches-compact-list"></div>

  <div id="emptyBox" style="display:none; text-align:center; padding: 40px 10px; color: var(--text-muted);">
    <h3 style="color: #fff; font-size: 0.95rem;">此範圍目前查無完場賽事</h3>
    <p style="font-size: 0.78rem; margin-top: 4px;">請點擊「🌐 即時網上抓取」或選擇其他日期範圍。</p>
  </div>

  <footer>
    <p>HKJC Football Match Tracker &copy; 2026 | By Ken Yip</p>
  </footer>
</div>

<div id="tutorialModal" class="modal-mask" onclick="closeTutorialModal(event)">
  <div class="modal-card" onclick="event.stopPropagation()">
    <div class="modal-header">
      <div style="font-weight: 700; color: #fff; font-size: 0.95rem;">📖 免費申請 API Key 教學</div>
      <button class="btn-sm" onclick="closeTutorialModal()">✕ 關閉</button>
    </div>
    <div class="modal-body">
      <p style="font-size: 0.8rem; color: #cbd5e1;">前往 <a href="https://dashboard.api-football.com/register" target="_blank" style="color: var(--accent-blue); font-weight: 700;">API-Sports 註冊 ↗</a>，在 Account ➔ My Access 複製 API Key（免費方案每日 100 次請求）。</p>
      <input type="password" id="tutKeyInput" class="input-sm" placeholder="貼上 API Key...">
      <button class="btn-full btn-blue" onclick="saveTutKey()">💾 儲存 Key</button>
    </div>
  </div>
</div>

<div id="settingsModal" class="modal-mask" onclick="closeSettingsModal(event)">
  <div class="modal-card" onclick="event.stopPropagation()">
    <div class="modal-header">
      <div style="font-weight: 700; color: #fff; font-size: 0.95rem;">⚙️ 系統設定</div>
      <button class="btn-sm" onclick="closeSettingsModal()">✕ 關閉</button>
    </div>
    <div class="modal-body">
      <div class="setting-group">
        <div style="font-size: 0.88rem; font-weight: 700; color: #fff;">🔑 API Key</div>
        <input type="password" id="txtApiKey" class="input-sm" placeholder="輸入 API Key...">
        <button class="btn-full btn-blue" onclick="saveApiKeyFromSettings()">💾 儲存</button>
      </div>
      <div class="setting-group">
        <button class="btn-full btn-green" onclick="triggerPWAInstall()">📲 加至手機主畫面 (⚽)</button>
      </div>
    </div>
  </div>
</div>

<script>
  let deferredPrompt = null;
  window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredPrompt = e; });
  function triggerPWAInstall() {
    if (deferredPrompt) { deferredPrompt.prompt(); deferredPrompt = null; }
    else alert('請點擊瀏覽器選單 ➔ 選擇「加至主畫面」安裝。');
  }

  function openSettingsModal() { document.getElementById('txtApiKey').value = localStorage.getItem('football_api_key') || ''; document.getElementById('settingsModal').classList.add('show'); }
  function closeSettingsModal() { document.getElementById('settingsModal').classList.remove('show'); }
  function openTutorialModal() { document.getElementById('tutorialModal').classList.add('show'); }
  function closeTutorialModal() { document.getElementById('tutorialModal').classList.remove('show'); }

  function saveBannerKey() {
    const k = document.getElementById('bannerKeyInput').value.trim();
    if (!k) return alert('請輸入 API Key！');
    localStorage.setItem('football_api_key', k);
    document.getElementById('apiKeyBanner').style.display = 'none';
    fetchMatchesForRange(true);
  }

  function saveTutKey() {
    const k = document.getElementById('tutKeyInput').value.trim();
    if (!k) return alert('請輸入 API Key！');
    localStorage.setItem('football_api_key', k);
    closeTutorialModal();
    document.getElementById('apiKeyBanner').style.display = 'none';
    fetchMatchesForRange(true);
  }

  function saveApiKeyFromSettings() {
    const k = document.getElementById('txtApiKey').value.trim();
    localStorage.setItem('football_api_key', k);
    closeSettingsModal();
    if (k) document.getElementById('apiKeyBanner').style.display = 'none';
    fetchMatchesForRange(true);
  }

  let matches = [];
  let curRange = 'today', curHT = 'all', customDateISO = null;

  function getDaysArray(numDays) {
    const arr = [];
    const now = new Date();
    for (let i = 0; i < numDays; i++) {
      const d = new Date(now);
      d.setDate(d.getDate() - i);
      arr.push(d.toISOString().slice(0, 10));
    }
    return arr;
  }

  document.addEventListener('DOMContentLoaded', () => {
    initChips();
    if (!localStorage.getItem('football_api_key')) {
      document.getElementById('apiKeyBanner').style.display = 'flex';
    }
    fetchMatchesForRange(false);
  });

  function initChips() {
    document.querySelectorAll('#dateChips .chip').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#dateChips .chip').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        curRange = btn.getAttribute('data-range');
        customDateISO = null;
        document.getElementById('singleDateInput').value = '';
        fetchMatchesForRange(false);
      });
    });

    document.querySelectorAll('#htChips .chip').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#htChips .chip').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        curHT = btn.getAttribute('data-ht');
        render();
      });
    });
  }

  function onSingleDateChange() {
    const val = document.getElementById('singleDateInput').value;
    if (!val) return;
    document.querySelectorAll('#dateChips .chip').forEach(b => b.classList.remove('active'));
    curRange = 'custom';
    customDateISO = val;
    fetchMatchesForRange(false);
  }

  async function fetchMatchesForRange(forceAlert = false) {
    const key = localStorage.getItem('football_api_key') || '';
    const loadingBox = document.getElementById('loadingBox');
    const loadingMsg = document.getElementById('loadingMsg');
    const statusText = document.getElementById('statusText');

    let datesToScan = [];
    if (curRange === 'today') datesToScan = getDaysArray(1);
    else if (curRange === 'yesterday') {
      const d = new Date();
      d.setDate(d.getDate() - 1);
      datesToScan = [d.toISOString().slice(0, 10)];
    } else if (curRange === '7d') datesToScan = getDaysArray(7);
    else if (curRange === '30d') datesToScan = getDaysArray(30);
    else if (curRange === '56d') datesToScan = getDaysArray(56);
    else if (curRange === 'custom' && customDateISO) datesToScan = [customDateISO];

    loadingBox.style.display = 'flex';
    loadingMsg.textContent = `正在向網上查詢 (${datesToScan.length} 天範圍)...`;

    let onlineResults = [];

    if (key) {
      try {
        for (const dateISO of datesToScan.slice(0, 8)) {
          const url = `https://v3.football.api-sports.io/fixtures?date=${dateISO}`;
          const res = await fetch(url, { headers: { 'x-apisports-key': key } });
          const json = await res.json();
          if (json && json.response) {
            json.response.forEach(item => {
              if (['FT','AET','PEN'].includes(item.fixture?.status?.short)) {
                const htH = item.score?.halftime?.home;
                const htA = item.score?.halftime?.away;
                const ftH = item.score?.fulltime?.home;
                const ftA = item.score?.fulltime?.away;
                if (htH !== null && htA !== null && ftH !== null && ftA !== null) {
                  const dStr = item.fixture?.date?.slice(0,10) || dateISO;
                  const parts = dStr.split('-');
                  onlineResults.push({
                    code: `FB${String(item.fixture?.id||'').slice(-4)}`,
                    id: String(item.fixture?.id),
                    dateText: `${parts[2]}/${parts[1]}/${parts[0]}`,
                    dateISO: dStr,
                    league: item.league?.name || '足球聯賽',
                    home: item.teams?.home?.name || '主隊',
                    away: item.teams?.away?.name || '客隊',
                    ftScore: `${ftH}:${ftA}`,
                    htScore: `${htH}:${htA}`
                  });
                }
              }
            });
          }
        }
      } catch (e) { console.log('API call failed:', e); }
    }

    if (onlineResults.length === 0) {
      try {
        const r = await fetch('data/matches.json?t=' + Date.now());
        if (r.ok) {
          const cloudData = await r.json();
          if (Array.isArray(cloudData)) {
            onlineResults = cloudData.filter(m => datesToScan.includes(m.dateISO || m.iso));
          }
        }
      } catch(e) {}
    }

    matches = onlineResults;
    matches.sort((a,b) => (b.dateISO > a.dateISO ? 1 : -1));
    populateLeagues();
    render();

    loadingBox.style.display = 'none';
    statusText.textContent = `🟢 網上即時掃描完成：找到 ${matches.length} 場完場賽事`;
    if (forceAlert) alert(`已完成網上搜尋！共找到 ${matches.length} 場完場賽果。`);
  }

  function populateLeagues() {
    const sel = document.getElementById('leagueSelect');
    if (!sel) return;
    const leagues = Array.from(new Set(matches.map(m => m.league))).filter(Boolean);
    sel.innerHTML = '<option value="all">所有聯賽</option>' + leagues.map(l => `<option value="${l}">${l}</option>`).join('');
  }

  function render() {
    const q = document.getElementById('searchInput').value.trim().toLowerCase();
    const selLeague = document.getElementById('leagueSelect').value;

    const filtered = matches.filter(m => {
      const mCleanHT = (m.htScore || '').replace(/\s+/g, '');
      if (curHT === 'combo' && !['1:0','2:0','0:1','0:2'].includes(mCleanHT)) return false;
      if (curHT !== 'all' && curHT !== 'combo' && mCleanHT !== curHT) return false;
      if (selLeague && selLeague !== 'all' && m.league !== selLeague) return false;
      if (q) {
        const text = `${m.code || ''} ${m.league || ''} ${m.home || ''} ${m.away || ''} ${m.dateText || ''}`.toLowerCase();
        if (!text.includes(q)) return false;
      }
      return true;
    });

    document.getElementById('displayCount').textContent = filtered.length;
    document.getElementById('matchCount').textContent = filtered.filter(m => ['1:0','2:0','0:1','0:2'].includes((m.htScore||'').replace(/\s+/g,''))).length;

    const list = document.getElementById('matchesList');
    const empty = document.getElementById('emptyBox');

    if (filtered.length === 0) {
      list.innerHTML = '';
      empty.style.display = 'block';
      return;
    }
    empty.style.display = 'none';

    list.innerHTML = filtered.map(m => {
      const isTarget = ['1:0','2:0','0:1','0:2'].includes((m.htScore||'').replace(/\s+/g, ''));
      return `
        <div class="compact-row ${isTarget ? 'matched' : ''}">
          <div class="col-meta-teams">
            <div class="line-meta">
              <span class="meta-code">${m.dateText} ${m.code || ''}</span>
              <span>·</span>
              <span class="meta-league">${m.league}</span>
            </div>
            <div class="line-teams">
              <span class="team-name" style="color: ${isTarget && (m.htScore.startsWith('1:') || m.htScore.startsWith('2:')) ? '#38bdf8' : '#fff'};">${m.home}</span>
              <span class="vs-tag">對</span>
              <span class="team-name" style="color: ${isTarget && (m.htScore.endsWith(':1') || m.htScore.endsWith(':2')) ? '#f59e0b' : '#fff'};">${m.away}</span>
            </div>
          </div>
          <div class="col-scores">
            <div class="score-ft">${m.ftScore}</div>
            <div class="badge-ht ${isTarget ? 'hit' : ''}">半 ${m.htScore}</div>
            <div class="arrow-icon">&gt;</div>
          </div>
        </div>
      `;
    }).join('');
  }

  function exportCSV() {
    let csv = '\uFEFF球賽編號,日期,聯賽,主隊,客隊,全場比數,半場比數\n';
    matches.forEach(m => csv += `"${m.code || ''}","${m.dateText}","${m.league}","${m.home}","${m.away}","${m.ftScore}","${m.htScore}"\n`);
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `HKJC_Matches_${curRange}.csv`;
    a.click();
  }
</script>
</body>
</html>
