<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>HKJC 足球賽果半場篩選追蹤器</title>

  <!-- PWA & Mobile App Meta Tags -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icons/soccer.svg">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="足球賽果">
  <meta name="theme-color" content="#0b1120">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #0b1120;
      --bg-secondary: #1e293b;
      --bg-card: #1e293b;
      --border-color: #334155;
      --accent-green: #10b981;
      --accent-blue: #38bdf8;
      --accent-amber: #f59e0b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --highlight-bg: rgba(16, 185, 129, 0.12);
      --highlight-border: rgba(16, 185, 129, 0.5);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-main);
      min-height: 100vh;
      padding: 16px;
      line-height: 1.5;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 20px;
      gap: 12px;
    }

    .title-group h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .title-group p {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .header-actions {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background-color: var(--bg-secondary);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 7px 12px;
      border-radius: 8px;
      font-size: 0.84rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn:hover { background-color: #334155; border-color: #475569; }
    .btn-primary { background-color: #2563eb; border-color: #3b82f6; }
    .btn-primary:hover { background-color: #1d4ed8; }
    .btn-success { background-color: #059669; border-color: #10b981; }
    .btn-notify-active { background-color: #059669; border-color: #10b981; color: #fff; }

    /* PWA Install Banner */
    .pwa-banner {
      display: none;
      align-items: center;
      justify-content: space-between;
      background: #1e293b;
      border: 1px solid var(--accent-blue);
      border-radius: 10px;
      padding: 10px 14px;
      margin-bottom: 16px;
      font-size: 0.85rem;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }

    .stat-card {
      background-color: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
    }

    .stat-label {
      font-size: 0.78rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
    }

    .stat-val {
      font-size: 1.55rem;
      font-weight: 700;
      margin-top: 4px;
      color: #fff;
    }

    .stat-val.highlight { color: var(--accent-green); }

    .filter-panel {
      background-color: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .filter-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .filter-label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      min-width: 80px;
    }

    .pill-group {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .pill-btn {
      background-color: #0f172a;
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 5px 12px;
      border-radius: 18px;
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .pill-btn:hover { border-color: #64748b; color: var(--text-main); }
    .pill-btn.active {
      background-color: var(--accent-green);
      color: #042f2e;
      border-color: var(--accent-green);
      font-weight: 700;
    }

    .pill-btn.pill-blue.active {
      background-color: var(--accent-blue);
      color: #082f49;
      border-color: var(--accent-blue);
    }

    .input-control {
      background-color: #0f172a;
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.84rem;
      outline: none;
    }

    .input-control:focus { border-color: var(--accent-blue); }

    .view-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding: 0 4px;
    }

    .results-count {
      font-size: 0.88rem;
      color: var(--text-muted);
    }

    .results-count strong { color: var(--accent-green); }

    .active-badge {
      display: inline-block;
      margin-left: 6px;
      font-size: 0.76rem;
      background-color: #334155;
      color: var(--accent-blue);
      padding: 2px 8px;
      border-radius: 4px;
    }

    /* HKJC Style Match Results List */
    .hkjc-list-container {
      background-color: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .hkjc-item {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border-color);
      transition: background-color 0.15s;
      position: relative;
    }

    .hkjc-item:last-child {
      border-bottom: none;
    }

    .hkjc-item:hover {
      background-color: rgba(255, 255, 255, 0.02);
    }

    .hkjc-item.matched-ht {
      background: linear-gradient(90deg, rgba(16, 185, 129, 0.08) 0%, rgba(30, 41, 59, 1) 100%);
      border-left: 4px solid var(--accent-green);
    }

    .item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .item-date {
      font-weight: 500;
      color: #94a3b8;
    }

    .item-league {
      font-weight: 600;
      color: var(--accent-blue);
    }

    .item-teams-line {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      font-size: 1.08rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 10px;
      text-align: center;
    }

    .tag-role {
      font-size: 0.72rem;
      font-weight: normal;
      color: var(--text-muted);
      margin-right: 4px;
    }

    .tag-role.away {
      margin-left: 4px;
      margin-right: 0;
    }

    .vs-text {
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-muted);
      padding: 0 4px;
    }

    .team-box {
      display: inline-flex;
      align-items: center;
    }

    .item-score-line {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      font-size: 1.25rem;
      font-weight: 700;
      color: #fff;
    }

    .ft-score {
      color: #fff;
      letter-spacing: 1px;
    }

    .ht-score-badge {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-left: 4px;
    }

    .ht-score-badge.highlight {
      color: var(--accent-green);
      background-color: var(--highlight-bg);
      border: 1px solid var(--highlight-border);
      padding: 2px 8px;
      border-radius: 6px;
    }

    .empty-state {
      text-align: center;
      padding: 50px 20px;
      color: var(--text-muted);
    }

    .empty-state h3 {
      font-size: 1.1rem;
      margin-bottom: 6px;
      color: #fff;
    }

    footer {
      margin-top: 30px;
      padding-top: 16px;
      border-top: 1px solid var(--border-color);
      text-align: center;
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background-color: rgba(0,0,0,0.7);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-overlay.show { display: flex; }
    .modal {
      background-color: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      max-width: 480px;
      width: 100%;
      padding: 20px;
    }

    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 0.82rem; color: var(--text-muted); margin-bottom: 4px; }
    .form-group input { width: 100%; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
  </style>
</head>
<body>

<div class="container">
  <!-- PWA Install Banner -->
  <div id="pwaBanner" class="pwa-banner">
    <div style="display: flex; align-items: center; gap: 10px;">
      <span style="font-size: 1.4rem;">⚽</span>
      <div>
        <div style="font-weight: 700; color: #fff;">加入至手機主畫面</div>
        <div style="font-size: 0.75rem; color: var(--text-muted);">一鍵加入主螢幕，體驗原生 App 般的全螢幕操作</div>
      </div>
    </div>
    <div style="display: flex; gap: 6px;">
      <button class="btn btn-primary" onclick="triggerPWAInstall()">📲 立即加入</button>
      <button class="btn" onclick="dismissPWABanner()">✕</button>
    </div>
  </div>

  <header>
    <div class="title-group">
      <h1>⚽ 賽果追蹤器</h1>
      <p>支援今天、昨天、上星期、上個月、56日歷史紀錄與半場 1:0 / 2:0 / 0:1 / 0:2 即時過濾</p>
    </div>
    <div class="header-actions">
      <button id="btnNotify" class="btn" onclick="toggleNotifications()">🔔 開啟通知</button>
      <button class="btn" onclick="testNotification()">⚡ 測試通知</button>
      <button class="btn" onclick="openAddModal()">➕ 新增賽事</button>
      <button class="btn" onclick="exportCSV()">📥 匯出 CSV</button>
      <button class="btn btn-primary" onclick="resetToDefaultData()">🔄 重置 56 日庫</button>
    </div>
  </header>

  <div class="stats-grid">
    <div class="stat-card">
      <span class="stat-label">當前範圍賽事數</span>
      <div class="stat-val" id="totalMatchesCount">0</div>
    </div>
    <div class="stat-card">
      <span class="stat-label">符合半場條件場次</span>
      <div class="stat-val highlight" id="filteredMatchesCount">0</div>
    </div>
    <div class="stat-card">
      <span class="stat-label">半場領先勝出率</span>
      <div class="stat-val" id="leadConversionRate">0%</div>
    </div>
    <div class="stat-card">
      <span class="stat-label">平均全場入球</span>
      <div class="stat-val" id="avgGoals">0.0</div>
    </div>
  </div>

  <div class="filter-panel">
    <div class="filter-row">
      <span class="filter-label">日期範圍：</span>
      <div class="pill-group" id="dateFilterPills">
        <button class="pill-btn pill-blue" data-range="today">今天</button>
        <button class="pill-btn pill-blue" data-range="yesterday">昨天</button>
        <button class="pill-btn pill-blue" data-range="last_week">上星期 (7日)</button>
        <button class="pill-btn pill-blue" data-range="last_month">上個月 (30日)</button>
        <button class="pill-btn pill-blue" data-range="56_days">過去 56 日</button>
        <button class="pill-btn pill-blue active" data-range="all">全部歷史</button>
      </div>
    </div>

    <div class="filter-row">
      <span class="filter-label">自訂日期：</span>
      <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap;">
        <label style="font-size: 0.82rem; color: var(--text-muted);">指定單日：</label>
        <input type="date" id="singleDateInput" class="input-control" onchange="onSingleDateChange()">
        <label style="font-size: 0.82rem; color: var(--text-muted); margin-left: 8px;">或起訖區間：</label>
        <input type="date" id="startDateInput" class="input-control" onchange="onDateRangeChange()">
        <span style="color: var(--text-muted);">-</span>
        <input type="date" id="endDateInput" class="input-control" onchange="onDateRangeChange()">
        <button class="btn" onclick="clearDateFilter()" style="padding: 4px 8px; font-size: 0.78rem;">清除限制</button>
      </div>
    </div>

    <div class="filter-row">
      <span class="filter-label">半場比數：</span>
      <div class="pill-group" id="htFilterPills">
        <button class="pill-btn active" data-filter="all">全部比數</button>
        <button class="pill-btn" data-filter="combo">🔥 1:0 / 2:0 / 0:1 / 0:2</button>
        <button class="pill-btn" data-filter="1-0">1 : 0 (主領先)</button>
        <button class="pill-btn" data-filter="2-0">2 : 0 (主領先)</button>
        <button class="pill-btn" data-filter="0-1">0 : 1 (客領先)</button>
        <button class="pill-btn" data-filter="0-2">0 : 2 (客領先)</button>
        <button class="pill-btn" data-filter="0-0">0 : 0 (半和)</button>
      </div>
    </div>

    <div class="filter-row">
      <span class="filter-label">聯賽篩選：</span>
      <select id="leagueSelect" class="input-control" style="min-width: 170px;">
        <option value="all">所有聯賽 / 盃賽</option>
      </select>
      <span class="filter-label" style="margin-left: 8px;">隊名搜尋：</span>
      <input type="text" id="searchInput" class="input-control" placeholder="搜尋隊伍名稱 (如 索察、阿仙奴)..." style="flex: 1; min-width: 180px;">
    </div>
  </div>

  <div class="view-toolbar">
    <div class="results-count">
      顯示中：<strong id="displayCount">0</strong> 場賽事
      <span id="activeRangeBadge" class="active-badge">全部歷史</span>
    </div>
  </div>

  <div id="matchesList" class="hkjc-list-container"></div>

  <div id="emptyState" class="empty-state" style="display: none;">
    <h3>查無符合條件的賽事</h3>
    <p>請嘗試切換其他日期或半場比數選項。</p>
  </div>

  <footer>
    <p>HKJC Style Match Results Tracker &copy; 2026 | PWA Ready</p>
  </footer>
</div>

<!-- Modal: Add Match -->
<div id="addMatchModal" class="modal-overlay">
  <div class="modal">
    <div class="modal-header">
      <h3 style="font-size: 1.15rem; font-weight: 700;">新增賽事資料</h3>
      <button class="btn" onclick="closeAddModal()">✕</button>
    </div>
    <form id="addMatchForm" onsubmit="handleAddMatch(event)">
      <div class="form-group">
        <label>聯賽 / 盃賽名稱</label>
        <input type="text" id="mLeague" class="input-control" required placeholder="例如：法國乙組聯賽、英格蘭超級聯賽">
      </div>
      <div class="form-group">
        <label>比賽日期時間</label>
        <input type="text" id="mTime" class="input-control" required placeholder="22/08/2026 03:00">
      </div>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
        <div class="form-group"><label>主隊名稱</label><input type="text" id="mHome" class="input-control" required placeholder="主隊"></div>
        <div class="form-group"><label>客隊名稱</label><input type="text" id="mAway" class="input-control" required placeholder="客隊"></div>
      </div>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
        <div class="form-group"><label>全場比數 (主 : 客)</label><input type="text" id="mFT" class="input-control" required placeholder="1:0"></div>
        <div class="form-group"><label>半場比數 (主 : 客)</label><input type="text" id="mHT" class="input-control" required placeholder="1:0"></div>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn" onclick="closeAddModal()">取消</button>
        <button type="submit" class="btn btn-success">儲存賽事</button>
      </div>
    </form>
  </div>
</div>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }

  let deferredPrompt = null;
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    document.getElementById('pwaBanner').style.display = 'flex';
  });

  function triggerPWAInstall() {
    if (deferredPrompt) {
      deferredPrompt.prompt();
      deferredPrompt.userChoice.then(() => {
        deferredPrompt = null;
        document.getElementById('pwaBanner').style.display = 'none';
      });
    } else {
      alert('iPhone 用戶請點擊 Safari 底部的「分享」按鈕 ➔ 選擇「加入至主畫面」即可安裝！');
    }
  }

  function dismissPWABanner() {
    document.getElementById('pwaBanner').style.display = 'none';
  }

  // Notifications
  let notifyEnabled = localStorage.getItem('hkjc_notify') === 'true';

  function updateNotifyBtn() {
    const btn = document.getElementById('btnNotify');
    if (Notification.permission === 'granted' && notifyEnabled) {
      btn.textContent = '🔔 已開啟通知';
      btn.classList.add('btn-notify-active');
    } else {
      btn.textContent = '🔔 開啟通知';
      btn.classList.remove('btn-notify-active');
    }
  }

  async function toggleNotifications() {
    if (!('Notification' in window)) {
      alert('您的瀏覽器不支援通知功能。');
      return;
    }
    if (Notification.permission !== 'granted') {
      const p = await Notification.requestPermission();
      if (p === 'granted') {
        notifyEnabled = true;
        localStorage.setItem('hkjc_notify', 'true');
        new Notification('⚽ 賽果通知已開啟', { body: '有符合半場 1:0/2:0/0:1/0:2 賽果時將即時推播。' });
      }
    } else {
      notifyEnabled = !notifyEnabled;
      localStorage.setItem('hkjc_notify', notifyEnabled ? 'true' : 'false');
    }
    updateNotifyBtn();
  }

  function testNotification() {
    if (Notification.permission !== 'granted') {
      toggleNotifications();
      return;
    }
    new Notification('⚽ [測試通知] 索察 1:0 甘岡 (完場)', {
      body: '半場比數：1:0 | 全場完場：1:0 (符合篩選條件)'
    });
  }

  const EMBEDDED_DATASET = [
    { dateText: "22/08/2026", dateISO: "2026-08-22", league: "法國乙組聯賽", home: "索察", away: "甘岡", ftScore: "1:0", htScore: "1:0" },
    { dateText: "22/08/2026", dateISO: "2026-08-22", league: "德國盃", home: "羅斯托克", away: "史特加", ftScore: "0:4", htScore: "0:2" },
    { dateText: "22/08/2026", dateISO: "2026-08-22", league: "法國乙組聯賽", home: "克萊蒙特", away: "第戎", ftScore: "1:1", htScore: "0:0" },
    { dateText: "22/08/2026", dateISO: "2026-08-22", league: "法國甲組聯賽", home: "登卡基", away: "蒙彼利埃", ftScore: "0:1", htScore: "0:0" },
    { dateText: "22/08/2026", dateISO: "2026-08-22", league: "法國乙組聯賽", home: "FC波城", away: "南錫", ftScore: "0:1", htScore: "0:0" },
    { dateText: "22/08/2026", dateISO: "2026-08-22", league: "烏拉圭甲組聯賽", home: "艾比安FC", away: "波士頓河", ftScore: "2:3", htScore: "1:2" },
    { dateText: "22/08/2026", dateISO: "2026-08-22", league: "法國甲組聯賽", home: "馬賽", away: "斯特拉斯堡", ftScore: "4:0", htScore: "0:0" },
    { dateText: "22/08/2026", dateISO: "2026-08-22", league: "比利時甲組聯賽", home: "標準列治", away: "拉路維爾", ftScore: "2:0", htScore: "0:0" },

    { dateText: "07/08/2026", dateISO: "2026-08-07", league: "日本職業聯賽", home: "神戶勝利船", away: "浦和紅鑽", ftScore: "2:0", htScore: "2:0" },
    { dateText: "02/08/2026", dateISO: "2026-08-02", league: "法國甲組聯賽", home: "巴黎聖日耳門", away: "里昂", ftScore: "4:1", htScore: "2:0" },
    { dateText: "27/07/2026", dateISO: "2026-07-27", league: "意大利甲組聯賽", home: "國際米蘭", away: "阿特蘭大", ftScore: "2:0", htScore: "1:0" },
    { dateText: "18/07/2026", dateISO: "2026-07-18", league: "美洲國家盃", home: "阿根廷", away: "哥倫比亞", ftScore: "1:0", htScore: "1:0" },
    { dateText: "08/07/2026", dateISO: "2026-07-08", league: "南美自由盃", home: "法林明高", away: "彭美拉斯", ftScore: "2:1", htScore: "2:0" },
    { dateText: "28/06/2026", dateISO: "2026-06-28", league: "巴西甲組聯賽", home: "保地花高", away: "高士路", ftScore: "3:0", htScore: "2:0" }
  ];

  let matchesData = [];
  let currentHTFilter = 'all';
  let currentDateRange = 'all';
  let customStartDate = null;
  let customEndDate = null;

  const TODAY_ISO = '2026-08-22';
  const YESTERDAY_ISO = '2026-08-21';

  document.addEventListener('DOMContentLoaded', () => {
    initFilters();
    updateNotifyBtn();
    loadInitialData();

    document.getElementById('searchInput').addEventListener('input', () => renderMatches());
    document.getElementById('leagueSelect').addEventListener('change', () => renderMatches());

    if (window.location.protocol.startsWith('http')) {
      setInterval(fetchOnlineData, 180000);
    }
  });

  function loadInitialData() {
    const saved = localStorage.getItem('hkjc_matches_hkjcstyle');
    if (saved) {
      try { matchesData = JSON.parse(saved); } catch (e) { matchesData = [...EMBEDDED_DATASET]; }
    } else {
      matchesData = [...EMBEDDED_DATASET];
    }
    populateLeagueDropdown();
    renderMatches();

    if (window.location.protocol.startsWith('http')) {
      fetchOnlineData();
    }
  }

  function fetchOnlineData() {
    fetch('data/matches.json?t=' + Date.now())
      .then(r => r.ok ? r.json() : null)
      .then(data => {
        if (data && Array.isArray(data) && data.length > 0) {
          const oldLen = matchesData.length;
          matchesData = data;
          populateLeagueDropdown();
          renderMatches();
          if (data.length > oldLen && oldLen > 0) {
            const m = data[0];
            if (['1:0','2:0','0:1','0:2'].includes(m.htScore.replace(/\\s+/g,''))) {
              new Notification(`⚽ 完場更新: ${m.home} ${m.ftScore} ${m.away}`, { body: `半場比數：${m.htScore} (${m.league})` });
            }
          }
        }
      })
      .catch(() => {});
  }

  function initFilters() {
    document.querySelectorAll('#htFilterPills .pill-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#htFilterPills .pill-btn').forEach(p => p.classList.remove('active'));
        btn.classList.add('active');
        currentHTFilter = btn.getAttribute('data-filter');
        renderMatches();
      });
    });

    document.querySelectorAll('#dateFilterPills .pill-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#dateFilterPills .pill-btn').forEach(p => p.classList.remove('active'));
        btn.classList.add('active');
        currentDateRange = btn.getAttribute('data-range');
        document.getElementById('singleDateInput').value = '';
        document.getElementById('startDateInput').value = '';
        document.getElementById('endDateInput').value = '';
        customStartDate = null;
        customEndDate = null;
        updateActiveRangeBadge();
        renderMatches();
      });
    });
  }

  function updateActiveRangeBadge() {
    const badge = document.getElementById('activeRangeBadge');
    const labels = {
      'today': '今天 (22/08/2026)',
      'yesterday': '昨天 (21/08/2026)',
      'last_week': '上星期 (過去7日)',
      'last_month': '上個月 (過去30日)',
      '56_days': '過去 56 日紀錄',
      'all': '全部歷史',
      'custom': customStartDate === customEndDate ? `指定: ${customStartDate}` : `${customStartDate || ''} ~ ${customEndDate || ''}`
    };
    badge.textContent = labels[currentDateRange] || '自訂範圍';
  }

  function onSingleDateChange() {
    const val = document.getElementById('singleDateInput').value;
    if (!val) return;
    document.querySelectorAll('#dateFilterPills .pill-btn').forEach(p => p.classList.remove('active'));
    currentDateRange = 'custom';
    customStartDate = val;
    customEndDate = val;
    document.getElementById('startDateInput').value = val;
    document.getElementById('endDateInput').value = val;
    updateActiveRangeBadge();
    renderMatches();
  }

  function onDateRangeChange() {
    const start = document.getElementById('startDateInput').value;
    const end = document.getElementById('endDateInput').value;
    if (!start && !end) return;
    document.querySelectorAll('#dateFilterPills .pill-btn').forEach(p => p.classList.remove('active'));
    currentDateRange = 'custom';
    customStartDate = start;
    customEndDate = end;
    updateActiveRangeBadge();
    renderMatches();
  }

  function clearDateFilter() {
    document.getElementById('singleDateInput').value = '';
    document.getElementById('startDateInput').value = '';
    document.getElementById('endDateInput').value = '';
    customStartDate = null;
    customEndDate = null;
    const allPill = document.querySelector('#dateFilterPills [data-range="all"]');
    if (allPill) {
      document.querySelectorAll('#dateFilterPills .pill-btn').forEach(p => p.classList.remove('active'));
      allPill.classList.add('active');
    }
    currentDateRange = 'all';
    updateActiveRangeBadge();
    renderMatches();
  }

  function populateLeagueDropdown() {
    const select = document.getElementById('leagueSelect');
    const leagues = Array.from(new Set(matchesData.map(m => m.league)));
    select.innerHTML = '<option value="all">所有聯賽 / 盃賽</option>';
    leagues.forEach(l => {
      const opt = document.createElement('option');
      opt.value = l;
      opt.textContent = l;
      select.appendChild(opt);
    });
  }

  function checkDateCriteria(dateISO) {
    const mDate = new Date(dateISO);
    const refDate = new Date(TODAY_ISO);

    if (currentDateRange === 'all') return true;
    if (currentDateRange === 'today') return dateISO === TODAY_ISO;
    if (currentDateRange === 'yesterday') return dateISO === YESTERDAY_ISO;
    if (currentDateRange === 'last_week') {
      const diff = (refDate - mDate) / (1000 * 60 * 60 * 24);
      return diff >= 0 && diff <= 7;
    }
    if (currentDateRange === 'last_month') {
      const diff = (refDate - mDate) / (1000 * 60 * 60 * 24);
      return diff >= 0 && diff <= 30;
    }
    if (currentDateRange === '56_days') {
      const diff = (refDate - mDate) / (1000 * 60 * 60 * 24);
      return diff >= 0 && diff <= 56;
    }
    if (currentDateRange === 'custom') {
      if (customStartDate && customEndDate) return dateISO >= customStartDate && dateISO <= customEndDate;
      if (customStartDate) return dateISO >= customStartDate;
      if (customEndDate) return dateISO <= customEndDate;
    }
    return true;
  }

  function checkHTCriteria(ht) {
    const clean = ht.replace(/\\s+/g, '');
    if (currentHTFilter === 'all') return true;
    if (currentHTFilter === 'combo') return ['1:0', '2:0', '0:1', '0:2'].includes(clean);
    if (currentHTFilter === '1-0') return clean === '1:0';
    if (currentHTFilter === '2-0') return clean === '2:0';
    if (currentHTFilter === '0-1') return clean === '0:1';
    if (currentHTFilter === '0-2') return clean === '0:2';
    if (currentHTFilter === '0-0') return clean === '0:0';
    return true;
  }

  function getFilteredMatches() {
    const search = document.getElementById('searchInput').value.trim().toLowerCase();
    const selectedLeague = document.getElementById('leagueSelect').value;

    return matchesData.filter(m => {
      if (!checkDateCriteria(m.dateISO)) return false;
      if (!checkHTCriteria(m.htScore)) return false;
      if (selectedLeague !== 'all' && m.league !== selectedLeague) return false;
      if (search) {
        const text = `${m.league} ${m.home} ${m.away}`.toLowerCase();
        if (!text.includes(search)) return false;
      }
      return true;
    });
  }

  function renderMatches() {
    const filtered = getFilteredMatches();
    const listContainer = document.getElementById('matchesList');
    const emptyState = document.getElementById('emptyState');
    const displayCount = document.getElementById('displayCount');

    displayCount.textContent = filtered.length;
    document.getElementById('filteredMatchesCount').textContent = filtered.length;

    if (filtered.length === 0) {
      listContainer.innerHTML = '';
      emptyState.style.display = 'block';
      updateStatisticsForScope(filtered);
      return;
    }
    emptyState.style.display = 'none';

    listContainer.innerHTML = filtered.map(m => {
      const isTarget = ['1:0', '2:0', '0:1', '0:2'].includes(m.htScore.replace(/\\s+/g, ''));
      return `
        <div class="hkjc-item ${isTarget ? 'matched-ht' : ''}">
          <div class="item-header">
            <span class="item-date">${m.dateText}</span>
            <span class="item-league">${m.league}</span>
          </div>

          <div class="item-teams-line">
            <div class="team-box">
              <span class="tag-role">[主]</span>
              <span>${m.home}</span>
            </div>
            <span class="vs-text">對</span>
            <div class="team-box">
              <span>${m.away}</span>
              <span class="tag-role away">[客]</span>
            </div>
          </div>

          <div class="item-score-line">
            <span class="ft-score">${m.ftScore}</span>
            <span class="ht-score-badge ${isTarget ? 'highlight' : ''}">(${m.htScore})</span>
          </div>
        </div>
      `;
    }).join('');

    updateStatisticsForScope(filtered);
  }

  function updateStatisticsForScope(data) {
    document.getElementById('totalMatchesCount').textContent = data.length;
    let leadCount = 0, winCount = 0, totalGoals = 0;
    data.forEach(m => {
      const [hHT, aHT] = m.htScore.split(':').map(Number);
      const [hFT, aFT] = m.ftScore.split(':').map(Number);
      totalGoals += (hFT + aFT);
      if (hHT !== aHT) {
        leadCount++;
        const htLeader = hHT > aHT ? 'home' : 'away';
        const ftWinner = hFT > aFT ? 'home' : hFT < aFT ? 'away' : 'draw';
        if (htLeader === ftWinner) winCount++;
      }
    });
    document.getElementById('leadConversionRate').textContent = leadCount > 0 ? `${((winCount / leadCount) * 100).toFixed(1)}%` : '0%';
    document.getElementById('avgGoals').textContent = data.length > 0 ? (totalGoals / data.length).toFixed(2) : '0.0';
  }

  function openAddModal() { document.getElementById('addMatchModal').classList.add('show'); }
  function closeAddModal() { document.getElementById('addMatchModal').classList.remove('show'); document.getElementById('addMatchForm').reset(); }

  function handleAddMatch(e) {
    e.preventDefault();
    const timeVal = document.getElementById('mTime').value.trim();
    const newMatch = {
      dateText: timeVal.slice(0, 10),
      dateISO: timeVal.includes('-') ? timeVal.slice(0, 10) : TODAY_ISO,
      league: document.getElementById('mLeague').value.trim(),
      home: document.getElementById('mHome').value.trim(),
      away: document.getElementById('mAway').value.trim(),
      ftScore: document.getElementById('mFT').value.trim(),
      htScore: document.getElementById('mHT').value.trim()
    };
    matchesData.unshift(newMatch);
    localStorage.setItem('hkjc_matches_hkjcstyle', JSON.stringify(matchesData));
    closeAddModal();
    populateLeagueDropdown();
    renderMatches();
  }

  function resetToDefaultData() {
    if (confirm('確定重置為預設 56 日歷史資料庫嗎？')) {
      matchesData = [...EMBEDDED_DATASET];
      localStorage.removeItem('hkjc_matches_hkjcstyle');
      populateLeagueDropdown();
      clearDateFilter();
      renderMatches();
    }
  }

  function exportCSV() {
    const filtered = getFilteredMatches();
    let csv = '\\uFEFF日期,聯賽,主隊,客隊,全場比數,半場比數\\n';
    filtered.forEach(m => {
      csv += `"${m.dateText}","${m.league}","${m.home}","${m.away}","${m.ftScore}","${m.htScore}"\\n`;
    });
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.setAttribute('href', url);
    link.setAttribute('download', `HKJC_Matches_${currentDateRange}_${new Date().toISOString().slice(0,10)}.csv`);
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  }
</script>
