name: "HKJC Football Daily Auto-Updater (GitHub Pro CI/CD)"

on:
  schedule:
    # 每日香港時間 00:00 (UTC 16:00) 及 06:00 (UTC 22:00) 自動觸發
    - cron: '0 16,22 * * *'
  workflow_dispatch: # 支援在 GitHub 網頁手動一鍵即時觸發更新

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-scores:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run HKJC Football Scraper & Analyzer
        run: |
          python scripts/update_scores.py

      - name: Commit and Push Updated Match Data
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/matches.json data/summary.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update HKJC football match results [skip ci]" && git push)

      - name: Upload Historical Match Archive Artifact (GitHub Pro 2GB Storage)
        uses: actions/upload-artifact@v4
        with:
          name: hkjc-matches-backup-${{ github.run_id }}
          path: data/
          retention-days: 60
